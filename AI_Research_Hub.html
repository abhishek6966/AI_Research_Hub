// ─── VIEW 4: Manage Companies ───────────────────────────────────────────────
// ─── VIEW 4: Manage Companies ───────────────────────────────────────────────
function ManageCompaniesView({ isEditMode, companies, setCompanies, docs, setDocs, activity, setActivity }) {
  const [name, setName] = useState('');
  const [country, setCountry] = useState('');
  const [sector, setSector] = useState('Industrials');
  const [industry, setIndustry] = useState('');
  const [continent, setContinent] = useState('North America');
  const [customSector, setCustomSector] = useState('');
  const [isCustomSector, setIsCustomSector] = useState(false);
  const [successMsg, setSuccessMsg] = useState('');
  
  // Selection states for bulk delete
  const [selectedIds, setSelectedIds] = useState([]);

  const fileInputRef = useRef(null);

  const sectors = ["Industrials", "Financials", "Health Care", "Consumer Discretionary", "Consumer Staples", "Materials", "Utilities", "Information Technology", "Communication Services", "Energy", "Real Estate"];

  function handleSubmit(e) {
    e.preventDefault();
    if (!isEditMode) {
      alert("Please unlock Edit Mode to add companies.");
      return;
    }
    if (!name.trim() || !country.trim()) return;

    const finalSector = isCustomSector ? customSector.trim() : sector;
    if (!finalSector) return;

    const newId = companies.length > 0 ? Math.max(...companies.map(c => c.id)) + 1 : 1;
    const newCompany = {
      id: newId,
      name: name.trim(),
      sector: finalSector,
      industry: industry.trim() || 'General',
      country: country.trim(),
      continent
    };

    const updatedCompanies = [...companies, newCompany];
    setCompanies(updatedCompanies);
    localStorage.setItem('fellowship_companies', JSON.stringify(updatedCompanies));

    // Initialize document tracking states for the new company
    const newDocs = { ...docs };
    DOCUMENT_TYPES.forEach(dt => {
      const key = `${newId}_${dt.id}`;
      const autoNA = getAutoNA(newCompany, dt);
      newDocs[key] = { status: autoNA ? 'na' : 'pending', link: '', notes: '', fileName: '', dateCollected: '' };
    });
    setDocs(newDocs);
    saveDocs(newDocs);

    // Log Activity
    const newActivity = [{ company: newCompany.name, doc: 'Company Registered', status: 'pending', ts: new Date().toISOString() }, ...activity.slice(0, 49)];
    setActivity(newActivity);
    logActivity({ company: newCompany.name, doc: 'Company Registered', status: 'pending' });

    // Reset Form
    setName('');
    setCountry('');
    setIndustry('');
    setCustomSector('');
    setIsCustomSector(false);

    setSuccessMsg(`Successfully added ${newCompany.name}!`);
    setTimeout(() => setSuccessMsg(''), 3000);
  }

  function handleFileUpload(e) {
    if (!isEditMode) {
      alert("Please unlock Edit Mode to import companies.");
      e.target.value = null;
      return;
    }
    const file = e.target.files[0];
    if (!file) return;

    const ext = file.name.split('.').pop().toLowerCase();
    const reader = new FileReader();

    reader.onload = (ev) => {
      let rows = [];
      try {
        if (ext === 'csv') {
          const text = ev.target.result;
          const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
          rows = parsed.data;
        } else if (['xlsx', 'xls'].includes(ext)) {
          const data = new Uint8Array(ev.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheetName = workbook.SheetNames[0];
          const sheet = workbook.Sheets[sheetName];
          rows = XLSX.utils.sheet_to_json(sheet);
        } else {
          alert('Unsupported file format. Please upload .xlsx, .xls, or .csv');
          return;
        }

        if (rows.length === 0) {
          alert('No data found in the uploaded file.');
          return;
        }

        let importedCount = 0;
        const newCompanies = [...companies];
        const newDocs = { ...docs };
        const newActivities = [...activity];

        let nextId = newCompanies.length > 0 ? Math.max(...newCompanies.map(c => c.id)) + 1 : 1;

        rows.forEach(row => {
          // Normalize column headers to support multiple variations
          const normalized = {};
          Object.keys(row).forEach(k => {
            const kl = k.toLowerCase().trim();
            if (['company', 'name', 'company name'].includes(kl)) normalized.name = row[k];
            else if (['country', 'region (country)', 'region'].includes(kl)) normalized.country = row[k];
            else if (kl === 'sector') normalized.sector = row[k];
            else if (kl === 'industry') normalized.industry = row[k];
            else if (kl === 'continent') normalized.continent = row[k];
          });

          if (!normalized.name || !String(normalized.name).trim()) return;

          const companyName = String(normalized.name).trim();
          const companyCountry = String(normalized.country || 'United States').trim();
          const companySector = String(normalized.sector || 'Industrials').trim();
          const companyIndustry = String(normalized.industry || 'General').trim();
          const companyContinent = String(normalized.continent || 'North America').trim();

          // Skip duplicate names
          if (newCompanies.some(c => c.name.toLowerCase() === companyName.toLowerCase())) {
            return;
          }

          const compObj = {
            id: nextId,
            name: companyName,
            sector: companySector,
            industry: companyIndustry,
            country: companyCountry,
            continent: companyContinent
          };

          newCompanies.push(compObj);

          // Initialize tracking
          DOCUMENT_TYPES.forEach(dt => {
            const key = `${nextId}_${dt.id}`;
            const autoNA = getAutoNA(compObj, dt);
            newDocs[key] = { status: autoNA ? 'na' : 'pending', link: '', notes: '', fileName: '', dateCollected: '' };
          });

          newActivities.unshift({
            company: companyName,
            doc: 'Company Imported',
            status: 'pending',
            ts: new Date().toISOString()
          });

          nextId++;
          importedCount++;
        });

        if (importedCount > 0) {
          setCompanies(newCompanies);
          localStorage.setItem('fellowship_companies', JSON.stringify(newCompanies));
          setDocs(newDocs);
          saveDocs(newDocs);
          setActivity(newActivities.slice(0, 50));
          localStorage.setItem(ACTIVITY_KEY, JSON.stringify(newActivities.slice(0, 50)));

          setSuccessMsg(`Successfully imported ${importedCount} companies from ${file.name}!`);
          setTimeout(() => setSuccessMsg(''), 4000);
        } else {
          alert('No new unique companies could be parsed. Make sure column headers are named Name/Company, Country, Sector, Industry, or Continent.');
        }

      } catch (err) {
        console.error(err);
        alert('Error parsing file: ' + err.message);
      }
    };

    if (ext === 'csv') {
      reader.readAsText(file);
    } else {
      reader.readAsArrayBuffer(file);
    }
    e.target.value = ''; // Reset input
  }

  function deleteCompany(id, name) {
    if (!isEditMode) {
      alert("Please unlock Edit Mode to delete companies.");
      return;
    }
    if (!confirm(`Are you sure you want to delete ${name}? This will clear all its documented URLs and notes.`)) return;

    const updatedCompanies = companies.filter(c => c.id !== id);
    setCompanies(updatedCompanies);
    localStorage.setItem('fellowship_companies', JSON.stringify(updatedCompanies));

    // Clean up docs
    const newDocs = { ...docs };
    DOCUMENT_TYPES.forEach(dt => {
      delete newDocs[`${id}_${dt.id}`];
    });
    setDocs(newDocs);
    saveDocs(newDocs);

    // Log Activity
    const newActivity = [{ company: name, doc: 'Company Removed', status: 'na', ts: new Date().toISOString() }, ...activity.slice(0, 49)];
    setActivity(newActivity);
    logActivity({ company: name, doc: 'Company Removed', status: 'na' });
    
    // Clear from selections
    setSelectedIds(prev => prev.filter(x => x !== id));
  }

  function deleteSelected() {
    if (!isEditMode) {
      alert("Please unlock Edit Mode to delete companies.");
      return;
    }
    if (selectedIds.length === 0) return;
    if (!confirm(`Are you sure you want to delete the ${selectedIds.length} selected companies? This will permanently wipe their documented files and notes!`)) return;

    const updatedCompanies = companies.filter(c => !selectedIds.includes(c.id));
    setCompanies(updatedCompanies);
    localStorage.setItem('fellowship_companies', JSON.stringify(updatedCompanies));

    // Clean up docs
    const newDocs = { ...docs };
    selectedIds.forEach(id => {
      DOCUMENT_TYPES.forEach(dt => {
        delete newDocs[`${id}_${dt.id}`];
      });
    });
    setDocs(newDocs);
    saveDocs(newDocs);

    const newActivity = [{ company: `${selectedIds.length} Companies`, doc: 'Batch Removed', status: 'na', ts: new Date().toISOString() }, ...activity.slice(0, 49)];
    setActivity(newActivity);
    logActivity({ company: `${selectedIds.length} Companies`, doc: 'Batch Removed', status: 'na' });

    setSelectedIds([]);
    setSuccessMsg(`Successfully deleted ${selectedIds.length} companies!`);
    setTimeout(() => setSuccessMsg(''), 3000);
  }

  function deleteAll() {
    if (!isEditMode) {
      alert("Please unlock Edit Mode to delete companies.");
      return;
    }
    if (!confirm(`⚠️ DANGER ZONE! ⚠️\n\nAre you sure you want to delete ALL ${companies.length} companies? This will completely empty your active research portfolio and delete all progress! This action CANNOT be undone.`)) return;

    setCompanies([]);
    localStorage.setItem('fellowship_companies', JSON.stringify([]));

    // Clear docs
    const newDocs = {};
    setDocs(newDocs);
    saveDocs(newDocs);

    const newActivity = [{ company: 'Full Portfolio', doc: 'Wiped Clean', status: 'na', ts: new Date().toISOString() }, ...activity.slice(0, 49)];
    setActivity(newActivity);
    logActivity({ company: 'Full Portfolio', doc: 'Wiped Clean', status: 'na' });

    setSelectedIds([]);
    setSuccessMsg('Active research portfolio wiped clean.');
    setTimeout(() => setSuccessMsg(''), 3000);
  }

  function resetToDefault() {
    if (!isEditMode) {
      alert("Please unlock Edit Mode to reset data.");
      return;
    }
    if (!confirm('Revert portfolio to the original 100 benchmark companies? This will delete all custom companies added.')) return;
    setCompanies(DEFAULT_COMPANIES);
    localStorage.removeItem('fellowship_companies');
    
    // Reset docs to match
    const newDocs = initDocs(DEFAULT_COMPANIES);
    setDocs(newDocs);
    saveDocs(newDocs);
    
    window.location.reload();
  }

  const allSelected = companies.length > 0 && selectedIds.length === companies.length;
  function toggleSelectAll() {
    if (allSelected) {
      setSelectedIds([]);
    } else {
      setSelectedIds(companies.map(c => c.id));
    }
  }

  return h('div', { className: 'manage-layout' }, [
    // Left Form Panel
    h('div', { className: 'manage-left' }, [
      h('h3', { style: { fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: '16px' } }, 'Add New Company'),
      h('p', { style: { fontSize: '12px', color: 'var(--text2)', lineHeight: '1.5' } }, 'Register a new company into your research portfolio. It will instantly appear in all dashboards, progress lists, search suggestions, and CSV exports.'),
      
      h('form', { onSubmit: handleSubmit, style: { display: 'flex', flexDirection: 'column', gap: '12px' } }, [
        h('div', { className: 'field-group' }, [
          h('div', { className: 'field-label' }, 'Company Name'),
          h('input', { className: 'field-input', required: true, value: name, onChange: e => setName(e.target.value), placeholder: 'e.g. NVIDIA' })
        ]),
        h('div', { className: 'field-group' }, [
          h('div', { className: 'field-label' }, 'Country'),
          h('input', { className: 'field-input', required: true, value: country, onChange: e => setCountry(e.target.value), placeholder: 'e.g. United States' })
        ]),
        h('div', { className: 'field-group' }, [
          h('div', { className: 'field-label' }, 'Continent'),
          h('select', { className: 'select-filter', style: { width: '100%' }, value: continent, onChange: e => setContinent(e.target.value) }, [
            h('option', { value: 'North America' }, 'North America'),
            h('option', { value: 'Europe' }, 'Europe'),
            h('option', { value: 'Asia' }, 'Asia'),
            h('option', { value: 'South America' }, 'South America'),
            h('option', { value: 'Africa' }, 'Africa'),
            h('option', { value: 'Oceania' }, 'Oceania')
          ])
        ]),
        h('div', { className: 'field-group' }, [
          h('div', { className: 'field-label' }, 'Sector'),
          !isCustomSector ? 
            h('div', { style: { display: 'flex', gap: '6px' } }, [
              h('select', { className: 'select-filter', style: { flex: 1 }, value: sector, onChange: e => setSector(e.target.value) },
                sectors.map(s => h('option', { key: s, value: s }, s))
              ),
              h('button', { type: 'button', className: 'btn-secondary', style: { padding: '8px' }, onClick: () => setIsCustomSector(true) }, 'Custom')
            ]) :
            h('div', { style: { display: 'flex', gap: '6px' } }, [
              h('input', { className: 'field-input', required: true, value: customSector, onChange: e => setCustomSector(e.target.value), placeholder: 'Enter sector...' }),
              h('button', { type: 'button', className: 'btn-secondary', style: { padding: '8px' }, onClick: () => setIsCustomSector(false) }, 'Select')
            ])
        ]),
        h('div', { className: 'field-group' }, [
          h('div', { className: 'field-label' }, 'Industry'),
          h('input', { className: 'field-input', value: industry, onChange: e => setIndustry(e.target.value), placeholder: 'e.g. Semiconductors' })
        ]),
        h('button', { type: 'submit', className: 'btn-primary', style: { width: '100%', marginTop: '4px' } }, 'Register Company'),
      ]),

      h('div', {
        style: {
          border: '1px dashed var(--border2)',
          borderRadius: '8px',
          padding: '12px',
          textAlign: 'center',
          background: 'var(--bg3)',
          cursor: 'pointer',
          transition: 'all 0.15s'
        },
        onClick: () => fileInputRef.current?.click()
      }, [
        h('input', {
          type: 'file',
          ref: fileInputRef,
          accept: '.xlsx,.xls,.csv',
          style: { display: 'none' },
          onChange: handleFileUpload
        }),
        h('div', { style: { fontSize: '11px', color: 'var(--accent)', fontWeight: '600' } }, 'Import from Excel / CSV'),
        h('div', { style: { fontSize: '9px', color: 'var(--text3)', marginTop: '4px' } }, 'Supports: Name, Country, Sector, Industry, Continent')
      ]),

      successMsg && h('div', { className: 'alert-note', style: { color: 'var(--green)', background: 'var(--green-dim)', borderColor: 'var(--green)', display: 'flex', alignItems: 'center', gap: '6px' } }, [
        h(CheckCircleIcon),
        successMsg
      ]),
      
      h('button', { className: 'btn-secondary', style: { width: '100%', color: '#f87171', borderColor: 'rgba(248,113,113,0.3)', marginTop: 'auto' }, onClick: resetToDefault }, 'Reset to Default 100 List')
    ]),

    // Right List Panel
    h('div', { className: 'manage-right' }, [
      h('div', { style: { padding: '16px 20px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '10px' } }, [
        h('h3', { style: { fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: '15px' } }, 'Active Research Portfolio'),
        h('div', { style: { display: 'flex', gap: '8px', alignItems: 'center' } }, [
          selectedIds.length > 0 && h('button', {
            className: 'btn-secondary',
            style: { color: '#f87171', borderColor: 'rgba(248,113,113,0.3)', padding: '4px 10px', fontSize: '11px' },
            onClick: deleteSelected
          }, `Delete Selected (${selectedIds.length})`),
          companies.length > 0 && h('button', {
            className: 'btn-secondary',
            style: { color: '#f87171', borderColor: 'rgba(248,113,113,0.3)', padding: '4px 10px', fontSize: '11px' },
            onClick: deleteAll
          }, 'Delete All'),
          h('div', { className: 'topbar-badge' }, `${companies.length} Companies Total`)
        ])
      ]),
      h('div', { style: { flex: 1, overflowY: 'auto', padding: '12px' } }, [
        h('div', { className: 'table-wrap' }, [
          h('table', { className: 'company-table' }, [
            h('thead', {}, h('tr', {}, [
              h('th', { style: { width: '40px' } }, h('input', { type: 'checkbox', checked: allSelected, onChange: toggleSelectAll })),
              h('th', {}, '#'),
              h('th', {}, 'Company'),
              h('th', {}, 'Country'),
              h('th', {}, 'Sector'),
              h('th', {}, 'Progress'),
              h('th', { style: { textAlign: 'right' } }, 'Actions')
            ])),
            h('tbody', {}, companies.map((c, i) => {
              const prog = getCompanyProgress(docs, c.id);
              const isCustom = c.id > 100;
              return h('tr', { key: c.id, style: { cursor: 'default' } }, [
                h('td', {}, h('input', {
                  type: 'checkbox',
                  checked: selectedIds.includes(c.id),
                  onChange: () => {
                    setSelectedIds(prev => prev.includes(c.id) ? prev.filter(id => id !== c.id) : [...prev, c.id]);
                  }
                })),
                h('td', { style: { fontFamily: 'var(--font-mono)', color: 'var(--text3)', fontSize: '11px' } }, c.id),
                h('td', {}, [
                  h('div', { className: 'company-name' }, c.name),
                  h('div', { className: 'company-meta' }, [
                    c.industry,
                    isCustom && h('span', { className: 'badge badge-sector', style: { marginLeft: '6px', color: 'var(--accent)', borderColor: 'var(--accent)' } }, 'Custom')
                  ])
                ]),
                h('td', {}, c.country),
                h('td', {}, h('span', { className: 'badge badge-sector', style: { borderLeftColor: SECTOR_COLORS[c.sector] || 'var(--accent)', borderLeftWidth: 3 } }, c.sector)),
                h('td', {}, `${prog}/8 docs`),
                h('td', { style: { textAlign: 'right' } },
                  h('button', {
                    className: 'btn-secondary',
                    style: { padding: '4px 8px', fontSize: '11px', color: '#f87171', borderColor: 'transparent', background: 'transparent' },
                    onClick: () => deleteCompany(c.id, c.name)
                  }, 'Delete')
                )
              ]);
            }))
          ])
        ])
      ])
    ])
  ]);
}

// ─── VIEW 5: Instructions ───────────────────────────────────────────────────
function InstructionsView() {
  return h('div', { className: 'dashboard', style: { maxWidth: '800px', margin: '0 auto', paddingBottom: '40px' } },
    h('div', { className: 'card', style: { marginBottom: '20px' } },
      h('h2', { style: { display: 'flex', alignItems: 'center', gap: '8px', color: 'var(--accent)', marginBottom: '16px' } }, [
        h(HelpCircleIcon), 'How to Use This Tool'
      ]),
      h('p', { style: { lineHeight: '1.6' } }, 'This portal helps you track and download your documents for your AI Research Project. Follow these instructions to make the most of the features.')
    ),
    h('div', { className: 'card', style: { marginBottom: '20px' } },
      h('h3', { style: { color: 'var(--text)', marginBottom: '12px' } }, '1. The Bulk Download Feature & CORS Errors'),
      h('p', { style: { marginBottom: '12px', lineHeight: '1.6' } }, 'When you click "Download All (.ZIP)", the web app tries to fetch all 8 PDF files concurrently in the background and package them into a single zip file for convenience.'),
      h('p', { style: { marginBottom: '10px', fontWeight: 'bold', color: 'var(--amber)' } }, 'Why do downloads fail (HTTP 403 / CORS)?'),
      h('p', { style: { marginBottom: '16px', lineHeight: '1.6' } }, 'Companies like John Deere use strict Web Application Firewalls (WAF) to prevent bots from scraping their files. They enforce "CORS" (Cross-Origin Resource Sharing) which stops our web app (hosted on GitHub Pages) from downloading their files directly via Javascript.'),
      h('div', { style: { background: 'var(--bg2)', padding: '16px', borderRadius: '8px', borderLeft: '4px solid var(--accent)' } },
        h('h4', { style: { marginBottom: '12px' } }, 'The Solution: Install a CORS Unblocker Extension'),
        h('ol', { style: { paddingLeft: '24px', lineHeight: '1.8' } }, [
          h('li', {}, h('a', { href: 'https://chrome.google.com/webstore/detail/allow-cors-access-control/lhobafahddgcelffkeicbaginigeejlf', target: '_blank', rel: 'noopener', style: { color: 'var(--accent)', textDecoration: 'underline' } }, 'Click here to install the "Allow CORS" Chrome extension')),
          h('li', {}, 'Click the extension icon in your browser toolbar to toggle it ON (the icon usually turns colored).'),
          h('li', {}, 'Refresh this page and click "Download All" again. The extension will spoof the browser headers, tricking the WAF into allowing the download!'),
        ])
      )
    ),
    h('div', { className: 'card', style: { marginBottom: '20px' } },
      h('h3', { style: { color: 'var(--text)', marginBottom: '12px' } }, '2. Automatic Download Fallback'),
      h('p', { style: { marginBottom: '12px', lineHeight: '1.6' } }, 'If you cannot install a CORS extension, the app has a built-in fallback. It will zip up the files it successfully fetches. For any files blocked by firewalls, it will automatically open them directly in new browser tabs.'),
      h('p', { style: { lineHeight: '1.6' } }, 'Because native browser tabs bypass cross-origin restrictions, they will download successfully. Just make sure you allow Popups for this site so it can open the dead links!')
    ),
    h('div', { className: 'card' },
      h('h3', { style: { color: 'var(--text)', marginBottom: '12px' } }, '3. Admin Passcode (Edit Mode)'),
      h('p', { style: { lineHeight: '1.6' } }, 'To prevent accidental edits or wipes, modifying links, deleting companies, importing JSON files, or resetting progress requires Edit Mode. Click the "Locked" button at the bottom of the sidebar to unlock it using your passcode.')
    )
  );
}

// ─── MAIN APP ────────────────────────────────────────────────────────────────
function App() {
  // ── PERSISTENT NAVIGATION STATE ─────────────────────────────────────────────
  // Read last saved nav state from localStorage so refresh restores location
  const [view, setViewRaw] = useState(() => {
    try { return JSON.parse(localStorage.getItem('fellowship_nav'))?.view || 'dashboard'; } catch { return 'dashboard'; }
  });
  const [selectedCompany, setSelectedCompanyRaw] = useState(() => {
    try {
      const id = JSON.parse(localStorage.getItem('fellowship_nav'))?.selectedCompany || null;
      // Validate that the company still exists
      if (id !== null) {
        const existingCompanies = loadCompanies();
        if (!existingCompanies.some(c => c.id === id)) return null;
      }
      return id;
    } catch { return null; }
  });

  // Wrap setters so every navigation change is immediately persisted
  function setView(v) {
    setViewRaw(v);
    try {
      const cur = JSON.parse(localStorage.getItem('fellowship_nav')) || {};
      localStorage.setItem('fellowship_nav', JSON.stringify({ ...cur, view: v }));
    } catch {}
  }
  function setSelectedCompany(id) {
    setSelectedCompanyRaw(id);
    try {
      const cur = JSON.parse(localStorage.getItem('fellowship_nav')) || {};
      localStorage.setItem('fellowship_nav', JSON.stringify({ ...cur, selectedCompany: id }));
    } catch {}
  }
  // ─────────────────────────────────────────────────────────────────────────────

  const [companiesRaw, setCompaniesRaw] = useState(() => loadCompanies());
  const [docsRaw, setDocsRaw] = useState(() => loadDocs(companiesRaw));
  const [activityRaw, setActivityRaw] = useState(() => loadActivity());
  const [theme, setTheme] = useState(() => localStorage.getItem('fellowship_theme') || 'light');
  const [syncStatus, setSyncStatus] = useState('synced'); // 'synced', 'syncing'

  // Wrapped setters for bidirectional sync
  const setCompanies = (val) => {
    const next = typeof val === 'function' ? val(companiesRaw) : val;
    setCompaniesRaw(next);
    setSyncStatus('syncing');
    syncToFirebase({ companies: next });
    setTimeout(() => setSyncStatus('synced'), 800);
  };
  const setDocs = (val) => {
    const next = typeof val === 'function' ? val(docsRaw) : val;
    setDocsRaw(next);
    setSyncStatus('syncing');
    syncToFirebase({ docs: next });
    setTimeout(() => setSyncStatus('synced'), 800);
  };
  const setActivity = (val) => {
    const next = typeof val === 'function' ? val(activityRaw) : val;
    setActivityRaw(next);
    setSyncStatus('syncing');
    syncToFirebase({ activity: next });
    setTimeout(() => setSyncStatus('synced'), 800);
  };

  // Aliases for the rest of the app to use
  const companies = companiesRaw;
  const docs = docsRaw;
  const activity = activityRaw;

  // LIFTED COMPANY FILTERS FOR COHESIVE INTERACTIVITY
  const [companySearch, setCompanySearch] = useState('');
  const [companySector, setCompanySector] = useState('');
  const [companyStatus, setCompanyStatus] = useState('all');
  const [companyContinents, setCompanyContinents] = useState([]);
  const [companyWeek, setCompanyWeek] = useState('');

  // ADMIN LOCK
  const ADMIN_PASSCODE = 'abhishek2026';
  const [isEditMode, setIsEditMode] = useState(() => localStorage.getItem('fellowship_admin_lock') === 'unlocked');
  const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
  const [showPasscodeModal, setShowPasscodeModal] = useState(false);
  const [passcodeInput, setPasscodeInput] = useState('');
  const [passcodeError, setPasscodeError] = useState('');

  function handleLockToggle() {
    if (isEditMode) { 
      setIsEditMode(false); 
      localStorage.removeItem('fellowship_admin_lock');
      return; 
    }
    setPasscodeInput('');
    setPasscodeError('');
    setShowPasscodeModal(true);
  }
  function handlePasscodeSubmit(e) {
    e.preventDefault();
    if (passcodeInput === ADMIN_PASSCODE) {
      setIsEditMode(true);
      localStorage.setItem('fellowship_admin_lock', 'unlocked');
      setShowPasscodeModal(false);
      setPasscodeInput('');
      setPasscodeError('');
    } else {
      setPasscodeError('Incorrect passcode. Please try again.');
      setPasscodeInput('');
    }
  }

  // FIREBASE SYNC
  useEffect(() => {
    if (typeof window.firebaseDb !== 'undefined') {
      const { onSnapshot, doc: fbDoc } = window.firestoreFns || {};
      if (onSnapshot && fbDoc) {
        const unsub = onSnapshot(fbDoc(window.firebaseDb, 'research', 'main'), (snap) => {
          if (snap.exists()) {
            const data = snap.data();
            if (data.docs) setDocsRaw(data.docs);
            if (data.companies) setCompaniesRaw(data.companies);
            if (data.activity) setActivityRaw(data.activity);
          }
        });
        return () => unsub();
      }
    }
  }, []);

  useEffect(() => {
    document.body.className = theme === 'light' ? 'light' : '';
    document.getElementById('root').className = theme === 'light' ? 'light' : '';
    localStorage.setItem('fellowship_theme', theme);
  }, [theme]);

  const navItems = [
    { id: 'dashboard', label: 'Dashboard' },
    { id: 'companies', label: 'Companies' },
    { id: 'manage', label: 'Add Company' },
    { id: 'export', label: 'Export' },
    { id: 'instructions', label: 'How to Use' },
  ];

  const topbarTitles = {
    dashboard: 'Dashboard',
    companies: selectedCompany ? companies.find(c => c.id === selectedCompany)?.name || 'Company Detail' : 'Company List',
    manage: 'Manage Research Portfolio',
    export: 'Export & Reports',
    instructions: 'How to Use',
  };

  const collected = Object.values(docs).filter(d => d.status === 'found').length;
  const pct = companies.length > 0 ? Math.round(collected / (companies.length * 8) * 100) : 0;

  function getNavIcon(id) {
    if (id === 'dashboard') return h(HomeIcon, { className: 'nav-icon' });
    if (id === 'companies') return h(BuildingIcon, { className: 'nav-icon' });
    if (id === 'manage') return h(PlusIcon, { className: 'nav-icon' });
    if (id === 'export') return h(ExportIcon, { className: 'nav-icon' });
    if (id === 'instructions') return h(HelpCircleIcon, { className: 'nav-icon' });
    return null;
  }

  return h('div', { id: 'root2', style: { display: 'flex', height: '100vh', width: '100vw', maxWidth: '100vw', overflow: 'hidden' } },
    h('div', { className: 'mobile-overlay' + (isMobileMenuOpen ? ' open' : ''), onClick: () => setIsMobileMenuOpen(false) }),
    h('div', { className: 'sidebar' + (isMobileMenuOpen ? ' open' : '') },
      h('div', { className: 'sidebar-logo' },
        h('div', { className: 'sidebar-logo-title' }, 'AI Research\nHub'),
        h('div', { className: 'sidebar-logo-sub' }, 'Professionalism in AI Era'),
      ),
      navItems.map(item =>
        h('div', { key: item.id, className: 'nav-item' + (view === item.id ? ' active' : ''), onClick: () => { setView(item.id); if (item.id !== 'companies' && item.id !== 'manage') setSelectedCompany(null); setIsMobileMenuOpen(false); } }, [
          getNavIcon(item.id),
          h('span', { style: { marginLeft: '8px' } }, item.label)
        ])
      ),
      h('div', { className: 'theme-toggle', onClick: () => setTheme(t => t === 'dark' ? 'light' : 'dark') },
        theme === 'dark' ?
          h('span', { style: { display: 'flex', alignItems: 'center', gap: '8px' } }, [h(SunIcon), 'Light Mode']) :
          h('span', { style: { display: 'flex', alignItems: 'center', gap: '8px' } }, [h(MoonIcon), 'Dark Mode'])
      ),
      h('div', { className: 'sidebar-footer' }, [
        h('div', {}, 'Abhishek Mishra'),
        h('div', {}, 'Stevens — MSBA'),
        h('div', { style: { marginTop: 4, color: 'var(--accent)' } }, `${pct}% complete`),
        h('button', {
          className: 'btn-secondary',
          style: {
            width: '100%',
            marginTop: '10px',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            gap: '6px',
            borderColor: isEditMode ? 'var(--green)' : 'var(--border)',
            color: isEditMode ? 'var(--green)' : 'var(--text)',
            padding: '6px 8px',
            fontSize: '11px',
            background: 'var(--bg3)',
            borderRadius: '6px',
            cursor: 'pointer'
          },
          onClick: handleLockToggle
        }, isEditMode ? '🔓 Unlocked' : '🔒 Locked')
      ]),
    ),
    h('div', { className: 'main' },
      h('div', { className: 'topbar' },
        h('button', { className: 'hamburger-btn', onClick: () => setIsMobileMenuOpen(true) }, '☰'),
        h('div', { className: 'topbar-title' }, topbarTitles[view]),
        h('div', { className: 'topbar-badge' }, `${collected}/${companies.length * 8} docs`),
        h('div', { className: 'topbar-badge', style: { display: 'flex', alignItems: 'center', gap: '4px', color: syncStatus === 'syncing' ? 'var(--accent)' : 'var(--text2)', borderColor: syncStatus === 'syncing' ? 'var(--accent)' : 'var(--border)' } }, [
          syncStatus === 'syncing' ? '↻ Syncing...' : '✓ Synced'
        ]),
        h('div', { className: 'topbar-badge' }, `${new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`),
      ),
      h('div', { className: 'content' },
        view === 'dashboard' && h(Dashboard, {
          companies,
          docs,
          activity,
          setView,
          setSelectedCompany,
          setCompanyContinents: setCompanyContinents,
          setCompanyStatus: setCompanyStatus,
          setCompanySector: setCompanySector,
          setCompanyWeek: setCompanyWeek
        }),
        view === 'companies' && !selectedCompany && h(CompanyList, {
          companies,
          docs,
          onSelectCompany: id => setSelectedCompany(id),
          search: companySearch, setSearch: setCompanySearch,
          sectorFilter: companySector, setSectorFilter: setCompanySector,
          statusFilter: companyStatus, setStatusFilter: setCompanyStatus,
          continentFilter: companyContinents, setContinentFilter: setCompanyContinents,
          weekFilter: companyWeek, setWeekFilter: setCompanyWeek
        }),
        view === 'companies' && selectedCompany && h(CompanyDetail, {
          companies,
          companyId: selectedCompany, docs, setDocs, activity, setActivity,
          onBack: () => setSelectedCompany(null),
          onNav: (id) => setSelectedCompany(id),
          isEditMode
        }),
        view === 'manage' && h(ManageCompaniesView, {
          isEditMode,
          companies,
          setCompanies,
          docs,
          setDocs,
          activity,
          setActivity
        }),
        view === 'export' && h(ExportView, { companies, setCompanies, docs, setDocs, activity, setActivity, isEditMode }),
        view === 'instructions' && h(InstructionsView),
      ),
    ),
    showPasscodeModal && h('div', { className: 'modal-overlay' },
      h('form', { className: 'modal-content', onSubmit: handlePasscodeSubmit }, [
        h('div', { className: 'modal-header' }, [
          h('div', { className: 'modal-title' }, 'Admin Lock'),
          h('button', { type: 'button', className: 'modal-close-btn', onClick: () => { setShowPasscodeModal(false); setPasscodeError(''); } }, '✕')
        ]),
        h('div', { className: 'modal-body' }, [
          h('div', { className: 'modal-desc' }, 'Enter administrator passcode to enable editing of company data and document URLs.'),
          passcodeError && h('div', {
            style: {
              background: 'rgba(239, 68, 68, 0.1)',
              border: '1px solid rgba(239, 68, 68, 0.4)',
              color: '#ef4444',
              borderRadius: '6px',
              padding: '8px 12px',
              fontSize: '12px',
              marginTop: '8px',
              marginBottom: '8px',
              display: 'flex',
              alignItems: 'center',
              gap: '6px'
            }
          }, [
            h(AlertCircleIcon, { style: { color: '#ef4444', flexShrink: 0 } }),
            passcodeError
          ]),
          h('input', {
            className: 'modal-input',
            type: 'password',
            required: true,
            autoFocus: true,
            placeholder: 'Enter passcode...',
            value: passcodeInput,
            onChange: e => { setPasscodeInput(e.target.value); setPasscodeError(''); }
          })
        ]),
        h('div', { className: 'modal-actions' }, [
          h('button', { type: 'button', className: 'btn-secondary', style: { padding: '8px 16px', fontSize: '13px' }, onClick: () => { setShowPasscodeModal(false); setPasscodeError(''); } }, 'Cancel'),
          h('button', { type: 'submit', className: 'btn-primary', style: { padding: '8px 16px', fontSize: '13px' } }, 'Unlock')
        ])
      ])
    )
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
