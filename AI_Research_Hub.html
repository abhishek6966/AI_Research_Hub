                        },
                        title: 'View in Company Profile',
                        style: { flex: 1, padding: '10px', fontSize: '13px', display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '6px', backgroundColor: 'rgba(52, 211, 153, 0.1)', color: 'var(--green)', border: '1px solid rgba(52, 211, 153, 0.3)', borderRadius: '6px', cursor: 'pointer', transition: 'all 0.2s' } 
                      }, [h(CheckCircleIcon, { size: 14 }), 'Already Bound', h(ExternalLinkIcon, { size: 12, style: { marginLeft: '2px', opacity: 0.7 } })]),
                      h('button', { 
                        onClick: () => {
                           const key = `${selectedCompanyId}_${selectedDocType}`;
                           const newDocs = { ...docs };
                           const updatedLinks = existingLinks.filter((_, i) => i !== exactMatchIdx);
                           newDocs[key] = { ...newDocs[key], link: updatedLinks };
                           if (updatedLinks.length === 0) newDocs[key].status = 'pending';
                           setDocs(newDocs);
                           saveDocs(newDocs);
                        },
                        title: 'Remove this link',
                        style: { padding: '10px', display: 'flex', justifyContent: 'center', alignItems: 'center', backgroundColor: 'rgba(239, 68, 68, 0.05)', color: 'var(--red)', border: '1px solid rgba(239, 68, 68, 0.2)', borderRadius: '6px', cursor: 'pointer', transition: 'all 0.2s' } 
                      }, h('svg', { width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }, [ h('polyline', { points: '3 6 5 6 21 6' }), h('path', { d: 'M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2' }), h('line', { x1: 10, y1: 11, x2: 10, y2: 17 }), h('line', { x1: 14, y1: 11, x2: 14, y2: 17 }) ]))
                    ])
                  : hasExistingLink ? 
                    h('div', { style: { flex: 1, display: 'flex', gap: '8px' } }, [
                       h('button', { className: 'btn-primary', onClick: () => handleSaveToCompany(res.url, true), style: { flex: 1, padding: '10px', fontSize: '12px', display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '4px', backgroundColor: 'var(--accent)', color: 'white', border: 'none', borderRadius: '6px' } }, [h(PlusIcon, { size: 14 }), 'Append']),
                       h('button', { className: 'btn-secondary', onClick: () => handleSaveToCompany(res.url, false), style: { flex: 1, padding: '10px', fontSize: '12px', display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '4px', borderColor: 'var(--red)', color: 'var(--red)', borderRadius: '6px' } }, 'Overwrite')
                    ])
                  : h('button', { className: 'btn-primary', onClick: () => handleSaveToCompany(res.url), style: { flex: 1, padding: '10px', fontSize: '13px', display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '6px', borderRadius: '6px' } }, [h(PlusIcon, { size: 14 }), 'Bind to Company'])
                ])
              ]);
            })
          ]);
        })(),
        
        !isSearching && results.length === 0 && !errorMsg && h('div', { style: { color: 'var(--text3)', fontSize: '14px', textAlign: 'center', marginTop: '40px', padding: '40px', border: '1px dashed var(--border)', borderRadius: '12px', backgroundColor: 'var(--surface)' } }, [
           h(BotIcon, { size: 32, style: { color: 'var(--border)', marginBottom: '12px' } }),
           h('div', null, 'Ready to scrape.'),
           h('div', { style: { fontSize: '12px', marginTop: '4px' } }, 'Select targets above and launch the agent.')
        ])
      ])
    ]),
    
    // Right Panel (Preview iframe)
    h('div', { style: { flex: '1.4', display: 'flex', flexDirection: 'column', backgroundColor: 'var(--surface)' } }, [
      h('div', { style: { padding: '16px 24px', borderBottom: '1px solid var(--border)', backgroundColor: 'var(--bg)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' } }, [
        h('div', { style: { fontSize: '14px', fontWeight: '600', color: 'var(--text1)', display: 'flex', alignItems: 'center', gap: '8px' } }, [
          h(EyeIcon, { size: 16, style: { color: 'var(--accent)' } }), 'Live Document Frame'
        ]),
        previewUrl && h('a', { href: previewUrl, target: '_blank', style: { color: 'var(--accent)', fontSize: '13px', fontWeight: '500', textDecoration: 'none', display: 'flex', alignItems: 'center', gap: '4px', padding: '6px 12px', backgroundColor: 'rgba(59, 130, 246, 0.1)', borderRadius: '6px' } }, [
          'Open Original Link', h(ExternalLinkIcon, { size: 14 })
        ])
      ]),
      h('div', { style: { flex: 1, backgroundColor: '#f8fafc', position: 'relative' } }, [
        !previewUrl && h('div', { style: { position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', color: 'var(--text3)', fontSize: '14px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '12px' } }, [
            h(EyeIcon, { size: 48, style: { opacity: 0.2 } }),
            'Select a document to render preview'
        ]),
        previewUrl && iframeLoading && h('div', { style: { position: 'absolute', top: '0', left: '0', right: '0', bottom: '0', backgroundColor: 'rgba(255, 255, 255, 0.7)', zIndex: 10, display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', gap: '12px' } }, [
            h(RefreshIcon, { size: 32, className: 'spin', style: { color: 'var(--accent)' } }),
            h('span', { style: { fontSize: '14px', color: 'var(--text2)', fontWeight: '500' } }, 'Loading document frame...')
        ]),
        previewUrl && h('iframe', {
          src: `http://localhost:8080/proxy?url=${encodeURIComponent(previewUrl)}`,
          style: { width: '100%', height: '100%', border: 'none' },
          title: 'Document Preview',
          onLoad: () => setIframeLoading(false)
        })
      ])
    ])
  ]);
}



function App() {
  // ── PERSISTENT NAVIGATION STATE ─────────────────────────────────────────────
  // Read last saved nav state from localStorage so refresh restores location
  const [view, setViewRaw] = useState(() => {
    try { return JSON.parse(localStorage.getItem('fellowship_nav'))?.view || 'dashboard'; } catch { return 'dashboard'; }
  });
  const [selectedCompany, setSelectedCompanyRaw] = useState(() => {
    try {
      const id = JSON.parse(localStorage.getItem('fellowship_nav'))?.selectedCompany || null;
      // Validate that the company still exists
      if (id !== null) {
        const existingCompanies = loadCompanies();
        if (!existingCompanies.some(c => c.id === id)) return null;
      }
      return id;
    } catch { return null; }
  });

  // Wrap setters so every navigation change is immediately persisted
  function setView(v) {
    setViewRaw(v);
    try {
      const cur = JSON.parse(localStorage.getItem('fellowship_nav')) || {};
      localStorage.setItem('fellowship_nav', JSON.stringify({ ...cur, view: v }));
    } catch {}
  }
  function setSelectedCompany(id) {
    setSelectedCompanyRaw(id);
    try {
      const cur = JSON.parse(localStorage.getItem('fellowship_nav')) || {};
      localStorage.setItem('fellowship_nav', JSON.stringify({ ...cur, selectedCompany: id }));
    } catch {}
  }
  // ─────────────────────────────────────────────────────────────────────────────

  const [companiesRaw, setCompaniesRaw] = useState(() => loadCompanies());
  const [docsRaw, setDocsRaw] = useState(() => loadDocs(companiesRaw));
  const [activityRaw, setActivityRaw] = useState(() => loadActivity());
  const [theme, setTheme] = useState(() => localStorage.getItem('fellowship_theme') || 'light');
  const [syncStatus, setSyncStatus] = useState('synced'); // 'synced', 'syncing'

  // Wrapped setters for bidirectional sync
  const setCompanies = (val) => {
    const next = typeof val === 'function' ? val(companiesRaw) : val;
    setCompaniesRaw(next);
    setSyncStatus('syncing');
    syncToFirebase({ companies: next });
    setTimeout(() => setSyncStatus('synced'), 800);
  };
  const setDocs = (val) => {
    const next = typeof val === 'function' ? val(docsRaw) : val;
    setDocsRaw(next);
    setSyncStatus('syncing');
    syncToFirebase({ docs: next });
    setTimeout(() => setSyncStatus('synced'), 800);
  };
  const setActivity = (val) => {
    const next = typeof val === 'function' ? val(activityRaw) : val;
    setActivityRaw(next);
    setSyncStatus('syncing');
    syncToFirebase({ activity: next });
    setTimeout(() => setSyncStatus('synced'), 800);
  };

  // Aliases for the rest of the app to use
  const companies = companiesRaw;
  const docs = docsRaw;
  const activity = activityRaw;

  // LIFTED COMPANY FILTERS FOR COHESIVE INTERACTIVITY
  const [companySearch, setCompanySearch] = useState('');
  const [companySector, setCompanySector] = useState('');
  const [companyStatus, setCompanyStatus] = useState('all');
  const [companyContinents, setCompanyContinents] = useState([]);
  const [companyWeek, setCompanyWeek] = useState('');


  // GLOBAL DIALOG STATE
  const [dialogConfig, setDialogConfig] = useState(null);
  const [dialogInput, setDialogInput] = useState('');
  const [dialogError, setDialogError] = useState('');

  useEffect(() => {
    window.showGlobalDialog = (config) => {
      setDialogInput('');
      setDialogError('');
      setDialogConfig(config);
    };
  }, []);

  function handleDialogSubmit(e) {
    e.preventDefault();
    if (dialogConfig?.onConfirm) {
       // If it's a prompt, pass the input
       if (dialogConfig.type === 'prompt') {
          dialogConfig.onConfirm(dialogInput);
       } else {
          dialogConfig.onConfirm();
       }
    }
    // We don't automatically close on prompt if the callback handles validation (e.g. error setting)
    // Actually, let's close it by default unless they return a specific symbol?
    // Let's just close it, and if they need to show an error, they can call showGlobalDialog again!
    setDialogConfig(null);
  }

  // ADMIN LOCK
  const ADMIN_PASSCODE = 'abhishek2026';
  const [isEditMode, setIsEditMode] = useState(() => localStorage.getItem('fellowship_admin_lock') === 'unlocked');
  const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

  function handleLockToggle() {
    if (isEditMode) { 
      setIsEditMode(false); 
      localStorage.removeItem('fellowship_admin_lock');
      return; 
    }
    window.showGlobalDialog({
      type: 'prompt',
      title: 'Admin Lock',
      message: 'Enter administrator passcode to enable editing of company data and document URLs.',
      confirmText: 'Unlock',
      onConfirm: (val) => {
        if (val === ADMIN_PASSCODE) {
          setIsEditMode(true);
          localStorage.setItem('fellowship_admin_lock', 'unlocked');
        } else {
          window.showGlobalDialog({ type: 'alert', title: 'Error', message: 'Incorrect passcode. Please try again.', danger: true });
        }
      }
    });
  }

  // FIREBASE SYNC
  useEffect(() => {
    if (typeof window.firebaseDb !== 'undefined') {
      const { onSnapshot, doc: fbDoc } = window.firestoreFns || {};
      if (onSnapshot && fbDoc) {
        const unsub = onSnapshot(fbDoc(window.firebaseDb, 'research', 'main'), (snap) => {
          if (snap.exists()) {
            const data = snap.data();
            if (data.docs) setDocsRaw(data.docs);
            if (data.companies) setCompaniesRaw(data.companies);
            if (data.activity) setActivityRaw(data.activity);
          }
        });
        return () => unsub();
      }
    }
  }, []);

  useEffect(() => {
    document.body.className = theme === 'light' ? 'light' : '';
    document.getElementById('root').className = theme === 'light' ? 'light' : '';
    localStorage.setItem('fellowship_theme', theme);
  }, [theme]);

  const navItems = [
    { id: 'dashboard', label: 'Dashboard' },
    { id: 'companies', label: 'Companies' },
    { id: 'manage', label: 'Add Company' },
    { id: 'autosearch', label: 'Auto-Research' },
    { id: 'export', label: 'Export' },
    { id: 'instructions', label: 'How to Use' },
  ];

  const topbarTitles = {
    dashboard: 'Dashboard',
    companies: selectedCompany ? companies.find(c => c.id === selectedCompany)?.name || 'Company Detail' : 'Company List',
    manage: 'Manage Research Portfolio',
    autosearch: 'AI Auto-Researcher',
    export: 'Export & Reports',
    instructions: 'How to Use',
  };

  const collected = Object.values(docs).filter(d => d.status === 'found').length;
  const pct = companies.length > 0 ? Math.round(collected / (companies.length * 8) * 100) : 0;

  function getNavIcon(id) {
    if (id === 'dashboard') return h(HomeIcon, { className: 'nav-icon' });
    if (id === 'companies') return h(BuildingIcon, { className: 'nav-icon' });
    if (id === 'manage') return h(PlusIcon, { className: 'nav-icon' });
    if (id === 'autosearch') return h(BotIcon, { className: 'nav-icon' });
    if (id === 'export') return h(ExportIcon, { className: 'nav-icon' });
    if (id === 'instructions') return h(HelpCircleIcon, { className: 'nav-icon' });
    return null;
  }

  return h('div', { id: 'root2', style: { display: 'flex', height: '100vh', width: '100vw', maxWidth: '100vw', overflow: 'hidden' } },
    h('div', { className: 'mobile-overlay' + (isMobileMenuOpen ? ' open' : ''), onClick: () => setIsMobileMenuOpen(false) }),
    h('div', { className: 'sidebar' + (isMobileMenuOpen ? ' open' : '') },
      h('div', { className: 'sidebar-logo' },
        h('div', { className: 'sidebar-logo-title' }, 'AI Research\nHub'),
        h('div', { className: 'sidebar-logo-sub' }, 'Professionalism in AI Era'),
      ),
      navItems.map(item =>
        h('div', { key: item.id, className: 'nav-item' + (view === item.id ? ' active' : ''), onClick: () => { setView(item.id); if (item.id !== 'companies' && item.id !== 'manage') setSelectedCompany(null); setIsMobileMenuOpen(false); } }, [
          getNavIcon(item.id),
          h('span', { style: { marginLeft: '8px' } }, item.label)
        ])
      ),
      h('div', { className: 'theme-toggle', onClick: () => setTheme(t => t === 'dark' ? 'light' : 'dark') },
        theme === 'dark' ?
          h('span', { style: { display: 'flex', alignItems: 'center', gap: '8px' } }, [h(SunIcon), 'Light Mode']) :
          h('span', { style: { display: 'flex', alignItems: 'center', gap: '8px' } }, [h(MoonIcon), 'Dark Mode'])
      ),
      h('div', { className: 'sidebar-footer' }, [
        h('div', {}, 'Abhishek Mishra'),
        h('div', {}, 'Stevens — MSBA'),
        h('div', { style: { marginTop: 4, color: 'var(--accent)' } }, `${pct}% complete`),
        h('button', {
          className: 'btn-secondary',
          style: {
            width: '100%',
            marginTop: '10px',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            gap: '6px',
            borderColor: isEditMode ? 'var(--green)' : 'var(--border)',
            color: isEditMode ? 'var(--green)' : 'var(--text)',
            padding: '6px 8px',
            fontSize: '11px',
            background: 'var(--bg3)',
            borderRadius: '6px',
            cursor: 'pointer'
          },
          onClick: handleLockToggle
        }, isEditMode ? '🔓 Unlocked' : '🔒 Locked')
      ]),
    ),
    h('div', { className: 'main' },
      h('div', { className: 'topbar' },
        h('button', { className: 'hamburger-btn', onClick: () => setIsMobileMenuOpen(true) }, '☰'),
        h('div', { className: 'topbar-title' }, topbarTitles[view]),
        h('div', { className: 'topbar-badge' }, `${collected}/${companies.length * 8} docs`),
        h('div', { className: 'topbar-badge', style: { display: 'flex', alignItems: 'center', gap: '4px', color: syncStatus === 'syncing' ? 'var(--accent)' : 'var(--text2)', borderColor: syncStatus === 'syncing' ? 'var(--accent)' : 'var(--border)' } }, [
          syncStatus === 'syncing' ? '↻ Syncing...' : '✓ Synced'
        ]),
        h('div', { className: 'topbar-badge' }, `${new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`),
      ),
      h('div', { className: 'content' },
        view === 'dashboard' && h(Dashboard, {
          companies,
          docs,
          activity,
          setView,
          setSelectedCompany,
          setCompanyContinents: setCompanyContinents,
          setCompanyStatus: setCompanyStatus,
          setCompanySector: setCompanySector,
          setCompanyWeek: setCompanyWeek
        }),
        view === 'companies' && !selectedCompany && h(CompanyList, {
          companies,
          docs,
          onSelectCompany: id => setSelectedCompany(id),
          search: companySearch, setSearch: setCompanySearch,
          sectorFilter: companySector, setSectorFilter: setCompanySector,
          statusFilter: companyStatus, setStatusFilter: setCompanyStatus,
          continentFilter: companyContinents, setContinentFilter: setCompanyContinents,
          weekFilter: companyWeek, setWeekFilter: setCompanyWeek
        }),
        view === 'companies' && selectedCompany && h(CompanyDetail, {
          companies,
          companyId: selectedCompany, docs, setDocs, activity, setActivity,
          onBack: () => setSelectedCompany(null),
          onNav: (id) => setSelectedCompany(id),
          isEditMode
        }),
        view === 'manage' && h(ManageCompaniesView, {
          isEditMode,
          companies,
          setCompanies,
          docs,
          setDocs,
          activity,
          setActivity
        }),
                view === 'autosearch' && h(AutoResearchView, {
          companies, docs, setDocs, activity, setActivity, isEditMode, setView, setSelectedCompany
        }),
        view === 'export' && h(ExportView, { companies, setCompanies, docs, setDocs, activity, setActivity, isEditMode }),
        view === 'instructions' && h(InstructionsView),
      ),
    ),
    dialogConfig && h('div', { className: 'modal-overlay', style: { zIndex: 10000 } },
      h('form', { className: 'modal-content', onSubmit: handleDialogSubmit }, [
        h('div', { className: 'modal-header' }, [
          h('div', { className: 'modal-title' }, dialogConfig.title || 'Notification'),
          h('button', { type: 'button', className: 'modal-close-btn', onClick: () => { if(dialogConfig.onCancel) dialogConfig.onCancel(); setDialogConfig(null); } }, '✕')
        ]),
        h('div', { className: 'modal-body' }, [
          h('div', { className: 'modal-desc', style: { whiteSpace: 'pre-wrap' } }, dialogConfig.message),
          dialogConfig.type === 'prompt' && h('input', {
            className: 'modal-input',
            type: 'password',
            required: true,
            autoFocus: true,
            placeholder: dialogConfig.placeholder || 'Enter value...',
            value: dialogInput,
            style: { marginTop: '16px' },
            onChange: e => { setDialogInput(e.target.value); setDialogError(''); }
          })
        ]),
        h('div', { className: 'modal-actions' }, [
          (dialogConfig.type === 'confirm' || dialogConfig.type === 'prompt') && h('button', { type: 'button', className: 'btn-secondary', style: { padding: '8px 16px', fontSize: '13px' }, onClick: () => { if(dialogConfig.onCancel) dialogConfig.onCancel(); setDialogConfig(null); } }, dialogConfig.cancelText || 'Cancel'),
          h('button', { type: 'submit', className: dialogConfig.danger ? 'btn-primary danger-btn' : 'btn-primary', style: { padding: '8px 16px', fontSize: '13px', ...(dialogConfig.danger ? {backgroundColor: 'var(--red)', borderColor: 'var(--red)'} : {}) } }, dialogConfig.confirmText || 'OK')
        ])
      ])
    ),
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
