<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Research Hub — Professionalism in the AI Era</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --bg2: #13161e;
    --bg3: #1a1e28;
    --border: #242836;
    --border2: #2e3347;
    --text: #e8eaf0;
    --text2: #8b91a8;
    --text3: #555d78;
    --accent: #5b8af0;
    --accent2: #3d6de8;
    --green: #34d399;
    --green-dim: #1a3d30;
    --amber: #fbbf24;
    --amber-dim: #3d2f0a;
    --red: #f87171;
    --red-dim: #3d1a1a;
    --gray: #374151;
    --gray-dim: #1f2330;
    --purple: #a78bfa;
    --teal: #2dd4bf;
    --sidebar-w: 220px;
    --font-display: 'Outfit', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }
  .light {
    --bg: #f4f5f8;
    --bg2: #ffffff;
    --bg3: #eef0f5;
    --border: #dde1eb;
    --border2: #c8cdd9;
    --text: #111827;
    --text2: #4b5563;
    --text3: #9ca3af;
    --accent: #3d6de8;
    --accent2: #2558d9;
    --green-dim: #d1fae5;
    --amber-dim: #fef3c7;
    --red-dim: #fee2e2;
    --gray-dim: #e5e7eb;
    --purple: #7c3aed;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; font-family: var(--font-body); background: var(--bg); color: var(--text); font-size: 14px; }
  #root { display: flex; height: 100vh; width: 100vw; max-width: 100vw; overflow: hidden; }

  /* SIDEBAR */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    padding: 20px 0;
  }
  .sidebar-logo {
    padding: 0 20px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .sidebar-logo-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 15px;
    color: var(--text);
    line-height: 1.2;
  }
  .sidebar-logo-sub {
    font-size: 10px;
    color: var(--text3);
    font-family: var(--font-mono);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.15s;
    font-size: 13px;
    color: var(--text2);
    font-weight: 500;
  }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { border-left-color: var(--accent); background: var(--bg3); color: var(--accent); }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .sidebar-footer {
    margin-top: auto;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text3);
    font-family: var(--font-mono);
  }
  .theme-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 6px 20px;
    font-size: 12px;
    color: var(--text3);
    margin-top: 8px;
  }
  .theme-toggle:hover { color: var(--text2); }

  /* MAIN */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    height: 56px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 12px;
    background: var(--bg2);
    flex-shrink: 0;
  }
  .topbar-title { font-family: var(--font-display); font-weight: 700; font-size: 16px; flex: 1; }
  .topbar-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--bg3);
    color: var(--text2);
    border: 1px solid var(--border);
  }
  .content { flex: 1; overflow: auto; padding: 24px; }

  /* GLOBAL SCROLLBARS */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* CARDS */
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .kpi-card {
    background: linear-gradient(145deg, var(--bg2) 0%, var(--bg3) 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 20px 18px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 24px -4px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 60%);
    pointer-events: none;
  }
  .kpi-card:hover {
    transform: translateY(-3px);
    border-color: var(--border2);
    box-shadow: 0 12px 36px -6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .kpi-label {
    font-size: 10px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-family: var(--font-mono);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .kpi-value {
    font-family: var(--font-display);
    font-size: 36px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.03em;
    line-height: 1;
    margin-top: 2px;
  }
  .kpi-sub { font-size: 11px; color: var(--text2); margin-top: 8px; line-height: 1.4; }
  .kpi-accent {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    border-radius: 0 0 16px 16px;
  }
  .kpi-glow {
    position: absolute;
    top: -20px;
    right: -20px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    opacity: 0.08;
    filter: blur(20px);
    pointer-events: none;
  }

  /* SECTION HEADERS */
  .section-header {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-header::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, var(--border), transparent); }

  /* DOC TYPE GRID */
  .doc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 0; }
  .doc-tile {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }
  .doc-tile::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--green);
    transform: scaleX(0);
    transition: transform 0.2s;
  }
  .doc-tile:hover {
    border-color: var(--accent);
    background: var(--bg3);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px -4px rgba(0,0,0,0.3);
  }
  .doc-tile:hover::after { transform: scaleX(1); }
  .doc-tile-label { font-size: 10px; color: var(--text3); font-weight: 600; margin-bottom: 8px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; }
  .doc-tile-count { font-family: var(--font-display); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .doc-tile-bar { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.06); margin-top: 10px; overflow: hidden; }
  .doc-tile-fill { height: 100%; border-radius: 2px; background: var(--green); transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
  .doc-pillar { font-size: 9px; color: var(--text3); font-family: var(--font-mono); margin-top: 6px; opacity: 0.7; }

  /* CONTINENT BARS */
  .continent-grid { display: grid; gap: 6px; }
  .continent-row {
    display: grid;
    grid-template-columns: 120px 1fr 52px;
    gap: 12px;
    align-items: center;
    cursor: pointer;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid transparent;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .continent-row:hover {
    background: rgba(91,138,240,0.06);
    border-color: rgba(91,138,240,0.2);
    transform: translateX(3px);
  }
  .continent-label { font-size: 12px; font-weight: 500; color: var(--text); }
  .continent-bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.05); overflow: hidden; display: flex; }
  .continent-bar-seg { height: 100%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
  .continent-count { font-size: 11px; color: var(--text2); font-family: var(--font-mono); text-align: right; font-weight: 600; }

  /* ACTIVITY FEED & COHORT */
  .activity-feed { display: flex; flex-direction: column; gap: 4px; }
  .activity-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 7px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .activity-item:hover {
    background: rgba(91,138,240,0.07);
    border-color: rgba(91,138,240,0.2);
    transform: translateX(2px);
  }
  .cohort-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: all 0.15s ease;
    cursor: pointer;
  }
  .cohort-item:hover {
    background: rgba(91,138,240,0.06);
    border-color: rgba(91,138,240,0.25);
    transform: translateX(2px);
  }
  .activity-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px currentColor; }
  .activity-text { flex: 1; color: var(--text2); line-height: 1.4; }
  .activity-text strong { color: var(--text); font-weight: 600; }
  .activity-time { font-family: var(--font-mono); font-size: 10px; color: var(--text3); }

  /* FILTERS */
  .filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .search-input {
    flex: 1;
    min-width: 200px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 14px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .select-filter {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 12px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 12px;
    outline: none;
    cursor: pointer;
  }
  .chip-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text2);
    transition: all 0.15s;
    font-family: var(--font-mono);
  }
  .chip.active { background: var(--accent); color: white; border-color: var(--accent); }

  /* TABLE */
  .company-table { width: 100%; border-collapse: collapse; }
  .company-table th {
    text-align: left;
    font-size: 10px;
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text3);
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
  }
  .company-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .company-table tr:hover td { background: var(--bg2); cursor: pointer; }
  .company-name { font-weight: 600; font-size: 13px; color: var(--text); }
  .company-meta { font-size: 11px; color: var(--text3); }

  /* PROGRESS BAR INLINE */
  .prog-bar { width: 80px; height: 6px; border-radius: 3px; background: var(--bg3); overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .prog-fill { height: 100%; border-radius: 3px; background: var(--green); transition: width 0.3s; }

  /* BADGES */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    font-family: var(--font-mono);
    text-transform: uppercase;
  }
  .badge-complete { background: var(--green-dim); color: var(--green); }
  .badge-progress { background: var(--amber-dim); color: var(--amber); }
  .badge-notstarted { background: var(--gray-dim); color: var(--text3); }
  .badge-sector { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
  .badge-found { background: var(--green-dim); color: var(--green); }
  .badge-notfound { background: var(--red-dim); color: var(--red); }
  .badge-na { background: var(--gray-dim); color: var(--text3); }
  .badge-pending { background: var(--amber-dim); color: var(--amber); }

  /* COMPANY DETAIL */
  .detail-header {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }
  .detail-company-name { font-family: var(--font-display); font-size: 22px; font-weight: 800; }
  .detail-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .detail-progress-ring { flex-shrink: 0; }
  .detail-nav { display: flex; gap: 8px; margin-left: auto; align-items: center; }
  .btn-nav { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); cursor: pointer; font-size: 12px; transition: all 0.15s; }
  .btn-nav:hover { background: var(--bg2); color: var(--text); border-color: var(--border2); }

  /* PORTAL LINKS */
  .portal-links { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .portal-btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--accent);
    cursor: pointer;
    font-size: 11px;
    font-family: var(--font-mono);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
  }
  .portal-btn:hover { background: var(--bg3); border-color: var(--accent); }

  /* DOC ROWS */
  .doc-row {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 10px;
    padding: 14px 16px;
    transition: border-color 0.15s;
  }
  .doc-row:hover { border-color: var(--border2); }
  .doc-row-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .doc-num { font-family: var(--font-mono); font-size: 11px; color: var(--text3); width: 24px; }
  .doc-name { font-weight: 600; font-size: 13px; flex: 1; }
  .status-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .status-btn {
    padding: 4px 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text2);
    cursor: pointer;
    font-size: 11px;
    font-family: var(--font-mono);
    transition: all 0.15s;
  }
  .status-btn:hover { border-color: var(--border2); }
  .status-btn.active-found { background: var(--green-dim); color: var(--green); border-color: var(--green); }
  .status-btn.active-not_found { background: var(--red-dim); color: var(--red); border-color: var(--red); }
  .status-btn.active-na { background: var(--gray-dim); color: var(--text3); border-color: var(--text3); }
  .status-btn.active-pending { background: var(--amber-dim); color: var(--amber); border-color: var(--amber); }
  .doc-row-body { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field-group { display: flex; flex-direction: column; gap: 4px; }
  .field-label { font-size: 10px; color: var(--text3); font-family: var(--font-mono); text-transform: uppercase; }
  .field-input {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 6px 10px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  .field-input:focus { border-color: var(--accent); }
  .field-input:disabled { opacity: 0.4; cursor: not-allowed; }
  .filename-suggest {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
    padding: 4px 8px;
    background: var(--bg3);
    border-radius: 4px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    display: inline-block;
    margin-top: 2px;
  }
  .filename-suggest:hover { color: var(--accent); border-color: var(--accent); }
  .alert-note {
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 5px;
    background: var(--amber-dim);
    color: var(--amber);
    border: 1px solid rgba(251,191,36,0.3);
    margin-top: 6px;
    font-family: var(--font-mono);
  }
  .alert-note.info { background: var(--bg3); color: var(--text2); border-color: var(--border); }
  .doc-search-links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .saved-flash {
    font-size: 10px;
    color: var(--green);
    font-family: var(--font-mono);
    opacity: 0;
    transition: opacity 0.3s;
    margin-left: auto;
  }
  .saved-flash.show { opacity: 1; }

  /* EXPORT VIEW */
  .export-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .export-card h3 { font-family: var(--font-display); font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .export-card p { font-size: 12px; color: var(--text2); margin-bottom: 14px; line-height: 1.6; }
  .btn-primary {
    padding: 8px 18px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    font-family: var(--font-body);
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--accent2); }
  .btn-secondary {
    padding: 8px 18px;
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    font-family: var(--font-body);
    transition: all 0.15s;
  }
  .btn-secondary:hover { border-color: var(--border2); }
  .report-text {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text2);
    white-space: pre-wrap;
    line-height: 1.7;
    margin-top: 12px;
    max-height: 400px;
    overflow-y: auto;
  }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1000px) { 
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .doc-grid { grid-template-columns: repeat(2, 1fr); }
    .two-col { grid-template-columns: 1fr; }
  }
  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    margin-bottom: 16px;
    width: fit-content;
  }
  .back-btn:hover { color: var(--accent); }
  .daily-target-card {
    background: linear-gradient(135deg, var(--bg2), var(--bg3));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: 0 4px 24px -4px rgba(0,0,0,0.3);

// ─── FIREBASE SYNC HELPER ────────────────────────────────────────────────────
// Debounce timer so rapid edits don't hammer Firestore
let _syncTimer = null;
let _syncPayload = {};

function syncToFirebase(payload) {
  // Merge incoming payload into the pending sync payload
  _syncPayload = { ..._syncPayload, ...payload };
  
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(async () => {
    try {
      const payloadToSend = { ..._syncPayload };
      _syncPayload = {}; // Reset for the next batch
      
      const { setDoc: fbSetDoc, doc: fbDoc } = window.firestoreFns || {};
      if (!fbSetDoc || !fbDoc || !window.firebaseDb) return;
      
      await fbSetDoc(
        fbDoc(window.firebaseDb, 'research', 'main'),
        payloadToSend,
        { merge: true }
      );
    } catch (e) {
      console.warn('[Firebase] sync failed:', e);
    }
  }, 600); // 600 ms debounce
}

// ─── HELPERS ────────────────────────────────────────────────────────────────
function sanitizeName(name) {
  return name.replace(/['']/g,"").replace(/[éèê]/g,"e").replace(/[àâ]/g,"a").replace(/[ô]/g,"o").replace(/[ü]/g,"u").replace(/[ä]/g,"a").replace(/[ö]/g,"o").replace(/[ñ]/g,"n").replace(/[ç]/g,"c").replace(/[ü]/g,"u").replace(/[ß]/g,"ss").replace(/[&]/g,"and").replace(/[^a-zA-Z0-9\s]/g,"").trim().replace(/\s+/g,"_");
}

function cleanPastedUrl(url) {
  if (!url) return '';
  url = url.trim();
  try {
    // 1. Unwrap Google redirect
    if (url.includes('google.com/url?') || url.includes('google.co.in/url?') || url.includes('google.co.uk/url?')) {
      const urlObj = new URL(url);
      const target = urlObj.searchParams.get('q') || urlObj.searchParams.get('url');
      if (target) url = decodeURIComponent(target);
    }

    const urlObj = new URL(url);
    const host = urlObj.hostname.toLowerCase();

    // 2. SSRN download links → convert to permanent abstract page
    //    download.ssrn.com URLs use S3 presigned tokens that expire in ~5 min.
    //    The abstractId param lets us build a permanent working link instead.
    if (host === 'download.ssrn.com' || host.endsWith('.ssrn.com')) {
      const abstractId = urlObj.searchParams.get('abstractId');
      if (abstractId) {
        return `https://papers.ssrn.com/sol3/papers.cfm?abstract_id=${abstractId}`;
      }
      // No abstractId — try to extract numeric ID from path like /2025/7/15/5352747.pdf
      const pathMatch = urlObj.pathname.match(/\/(\d{5,})\.\w+$/);
      if (pathMatch) {
        return `https://papers.ssrn.com/sol3/papers.cfm?abstract_id=${pathMatch[1]}`;
      }
    }

    // 3. For AWS presigned URLs that EXPIRE (X-Amz-Expires present):
    //    Strip ALL query params → base URL. The presigned token expires in minutes
    //    so storing it is useless; the base path (e.g. the .pdf path) is more useful.
    if (urlObj.searchParams.has('X-Amz-Expires') || urlObj.searchParams.has('X-Amz-Signature')) {
      return urlObj.origin + urlObj.pathname;
    }

    // 4. Strip only marketing/analytics trackers — never strip auth params
    const trackParams = ['fbclid','gclid','dclid','msclkid','utm_source','utm_medium',
      'utm_campaign','utm_term','utm_content','utm_cid','utm_reader','utm_referrer'];
    let changed = false;
    trackParams.forEach(p => {
      if (urlObj.searchParams.has(p)) { urlObj.searchParams.delete(p); changed = true; }
    });
    if (changed) url = urlObj.toString();

  } catch (e) { /* fallback: return trimmed */ }
  return url;
}

// Returns the short display version of a URL (hostname + truncated path)
function shortUrlDisplay(url) {
  if (!url) return '';
  try {
    const u = new URL(url.startsWith('http') ? url : 'https://' + url);
    const path = u.pathname.length > 40 ? u.pathname.slice(0, 37) + '…' : u.pathname;
    return u.hostname + path;
  } catch { return url.length > 60 ? url.slice(0, 57) + '…' : url; }
}



function suggestFileName(company, doc) {
  const cn = sanitizeName(company.name);
  const year = new Date().getFullYear();
  const ext = doc.id === 'doc6' ? 'txt' : 'pdf';
  return `${cn}_${doc.fileKey}_${year}.${ext}`;
}

function genSearchUrl(company, doc) {
  const n = company.name;
  const kw = {
    doc1: 'code of conduct',
    doc2: 'ethics compliance policy',
    doc3: 'responsible AI ethics guidelines',
    doc4: 'ESG sustainability report 2023 2024',
    doc5: 'annual report 10-K FY2024',
    doc6: 'Q4 FY2024 earnings call transcript',
    doc7: 'proxy statement DEF 14A 2024',
    doc8: 'supplier code of conduct',
  };
  return `https://www.google.com/search?q=${encodeURIComponent('"'+n+'" '+kw[doc.id]+' filetype:pdf')}`;

function getPortalLinks(company) {
  const portal = PORTAL_BY_COUNTRY[company.country] || PORTAL_BY_COUNTRY["United States"];
  const n = company.name;
  const links = [];
  if (portal.general) links.push({ label: portal.general.label, url: portal.general.url(n) });
  if (portal.annualReport) links.push({ label: portal.annualReport.label, url: portal.annualReport.url(n) });
  if (portal.proxy) links.push({ label: portal.proxy.label, url: portal.proxy.url(n) });
  if (portal.transcript) links.push({ label: portal.transcript.label, url: portal.transcript.url(n) });
  // Special cases
  if (company.name === 'Atlassian' || company.name === 'KB Financial Group' || company.name === 'Novo Nordisk') {
    links.push({ label: 'SEC EDGAR 20-F', url: `https://www.sec.gov/cgi-bin/browse-edgar?company=${encodeURIComponent(n)}&type=20-F&action=getcompany` });
  }
  links.push({ label: 'Company IR (Google)', url: `https://www.google.com/search?q=${encodeURIComponent('"'+n+'" investor relations')}`});
  return links;
}

function getCompanyStatus(docs, companyId) {
  const companyDocs = DOCUMENT_TYPES.map(d => docs[`${companyId}_${d.id}`] || { status: 'pending' });
  const allResolved = companyDocs.every(d => d.status !== 'pending');
  const anyTouched = companyDocs.some(d => d.status !== 'pending');
  if (allResolved) return 'complete';
  if (anyTouched) return 'in-progress';
  return 'not-started';
}

function getCompanyProgress(docs, companyId) {
  return DOCUMENT_TYPES.filter(d => {
    const s = (docs[`${companyId}_${d.id}`] || {}).status;
    return s === 'found' || s === 'not_found' || s === 'na';
  }).length;
}

function getAutoNA(company, doc) {
  if (company.country === 'United Arab Emirates' && (doc.id === 'doc7' || doc.id === 'doc6')) return 'Emirates is state-owned — no public AGM or earnings calls';
  if (['Crédit Mutuel','DZ Bank','Landesbank Baden-Wuerttemberg'].includes(company.name) && (doc.id === 'doc5' || doc.id === 'doc6' || doc.id === 'doc7')) return 'Cooperative/state bank — limited public filings, use Bundesanzeiger';
  if (['Deutsche Bahn'].includes(company.name) && (doc.id === 'doc5' || doc.id === 'doc6' || doc.id === 'doc7')) return 'State-owned — use Bundesanzeiger';
  if (['CFE','ENBW','Energie Baden-WÃ¼rttemberg','Korea Electric Power','KEPCO'].includes(company.name) && (doc.id === 'doc6' || doc.id === 'doc7')) return 'State-owned utility — limited public filings';
  return null;
}

function getDocLinks(docState) {
  if (!docState || !docState.link) return [''];
  if (Array.isArray(docState.link)) return docState.link.length > 0 ? docState.link : [''];
  return [docState.link];
}

function getCompanyWeek(c) {
  if (c.id >= 1 && c.id <= 17) return 1;
  if (c.id >= 18 && c.id <= 34) return 2;
  if (c.id >= 35 && c.id <= 51) return 3;
  if (c.id >= 52 && c.id <= 68) return 4;
  if (c.id >= 69 && c.id <= 84) return 5;
  return 6;
}

function getCurrentWeekNum() {
  const start = new Date('2026-05-25');
  const now = new Date();
  const diff = now - start;
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  return Math.min(6, Math.max(1, Math.ceil((days + 1) / 7)));
}

function loadCompanies() {
  try {
    const stored = localStorage.getItem('fellowship_companies');
    return stored ? JSON.parse(stored) : DEFAULT_COMPANIES;
  } catch {
    return DEFAULT_COMPANIES;
  }
}

function initDocs(companyList) {
  const d = {};
  (companyList || loadCompanies()).forEach(c => {
    DOCUMENT_TYPES.forEach(dt => {
      const key = `${c.id}_${dt.id}`;
      const autoNA = getAutoNA(c, dt);
      d[key] = { status: autoNA ? 'na' : 'pending', link: '', notes: '', fileName: '', dateCollected: '' };
    });
  });
  return d;
}

function loadDocs(companyList) {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    const base = initDocs(companyList || loadCompanies());
    if (!s) return base;
    const parsed = JSON.parse(s);
    
    // Clear out automated notes from saved storage to match user request
    const companies = companyList || loadCompanies();
    companies.forEach(c => {
      DOCUMENT_TYPES.forEach(dt => {
        const key = `${c.id}_${dt.id}`;
        if (parsed[key]) {
          const autoNA = getAutoNA(c, dt);
          if (parsed[key].notes === autoNA) {
            parsed[key].notes = '';
          }
        }
      });
    });
    
    return { ...base, ...parsed };
  } catch { return initDocs(companyList || loadCompanies()); }
}

function saveDocs(d) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
}

function loadActivity() {
  try { return JSON.parse(localStorage.getItem(ACTIVITY_KEY)) || []; } catch { return []; }
}

function logActivity(activity) {
  const list = loadActivity();
  list.unshift({ ...activity, ts: new Date().toISOString() });
  localStorage.setItem(ACTIVITY_KEY, JSON.stringify(list.slice(0, 50)));
}

function ProgressRing({ pct, size = 60, stroke = 6, color = '#34d399' }) {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ - (pct / 100) * circ;
  return h('svg', { 
    width: size, 
    height: size, 
    viewBox: `0 0 ${size} ${size}`,
    style: { display: 'block', width: `${size}px`, height: `${size}px`, flexShrink: 0 } 
  },
    h('circle', { cx: size/2, cy: size/2, r, fill: 'none', stroke: 'var(--bg3)', strokeWidth: stroke }),
    h('circle', { cx: size/2, cy: size/2, r, fill: 'none', stroke: color, strokeWidth: stroke,
      strokeDasharray: circ, strokeDashoffset: offset, strokeLinecap: 'round',
      transform: `rotate(-90 ${size/2} ${size/2})`, style: { transition: 'stroke-dashoffset 0.5s', strokeDasharray: circ, strokeDashoffset: offset } }),
  );
}

  const localToday = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  const utcToday = now.toISOString().split('T')[0];

  const completed = companies.filter(c => getCompanyStatus(docs, c.id) === 'complete').length;
  const totalDocs = companies.length * 8;
  const collected = Object.values(docs).filter(d => d.status === 'found').length;
  const resolved = Object.values(docs).filter(d => d.status !== 'pending').length;

  const todayCount = Object.values(docs).filter(d => {
    return d.dateCollected && (d.dateCollected === localToday || d.dateCollected === utcToday) && d.status === 'found';
  }).length;

  const currentWeekNum = getCurrentWeekNum();

function CompanyList({ companies, docs, onSelectCompany, search, setSearch, sectorFilter, setSectorFilter, statusFilter, setStatusFilter, continentFilter, setContinentFilter, weekFilter, setWeekFilter }) {

  const sectors = [...new Set(companies.map(c => c.sector))].sort();
  const continents = [...new Set(companies.map(c => c.continent))];

  const filtered = useMemo(() => {
    return companies.filter(c => {
      if (search && !c.name.toLowerCase().includes(search.toLowerCase()) && !c.country.toLowerCase().includes(search.toLowerCase())) return false;
      if (sectorFilter && c.sector !== sectorFilter) return false;
      const status = getCompanyStatus(docs, c.id);
      if (statusFilter === 'complete' && status !== 'complete') return false;
      if (statusFilter === 'in-progress' && status !== 'in-progress') return false;
      if (statusFilter === 'not-started' && status !== 'not-started') return false;
      if (continentFilter.length > 0 && !continentFilter.includes(c.continent)) return false;
      if (weekFilter && String(getCompanyWeek(c)) !== weekFilter) return false;
      return true;
    });
  }, [companies, search, sectorFilter, statusFilter, continentFilter, weekFilter, docs]);

  const toggleContinent = (c) => setContinentFilter(prev => prev.includes(c) ? prev.filter(x => x !== c) : [...prev, c]);

  return h('div', {},
    h('div', { className: 'filter-bar' },
      h('input', { className: 'search-input', placeholder: 'Search company or country...', value: search, onChange: e => setSearch(e.target.value) }),

        h('option', { value: '6' }, 'Week 6 Cohort'),

      h('select', { className: 'select-filter', value: statusFilter, onChange: e => setStatusFilter(e.target.value) },
        h('option', { value: 'all' }, 'All Status'),
        h('option', { value: 'complete' }, 'Complete'),

        h('tbody', {},
          filtered.map(c => {

            const pct = prog / 8 * 100;

// ─── VIEW 3: Company Detail ──────────────────────────────────────────────────
function CompanyDetail({ companies, companyId, docs, setDocs, activity, setActivity, onBack, onNav, isEditMode }) {
  const company = companies.find(c => c.id === companyId);
  const [savedFlash, setSavedFlash] = useState({});
  const [isDownloading, setIsDownloading] = useState(false);
  const [downloadProgress, setDownloadProgress] = useState(null);
  const saveTimers = useRef({});
  const abortControllerRef = useRef(null);

  if (!company) return null;

  const prog = getCompanyProgress(docs, company.id);
  const portalLinks = getPortalLinks(company);

  function updateDoc(docId, field, value) {
    const key = `${company.id}_${docId}`;
    const oldDoc = docs[key] || {};
    const newDoc = { ...oldDoc, [field]: value };
    
    if (field === 'status' && value === 'found') {
      const now = new Date();
      newDoc.dateCollected = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    }
    
    const newDocs = { ...docs, [key]: newDoc };
    setDocs(newDocs);
    saveDocs(newDocs);

    // Flash saved
    setSavedFlash(p => ({ ...p, [docId]: true }));
    clearTimeout(saveTimers.current[docId]);
    saveTimers.current[docId] = setTimeout(() => setSavedFlash(p => ({ ...p, [docId]: false })), 1500);

    // Log activity if status changed
    if (field === 'status') {
      const dt = DOCUMENT_TYPES.find(d => d.id === docId);
      const newActivity = [{ company: company.name, doc: dt.shortLabel, status: value, ts: new Date().toISOString() }, ...activity.slice(0, 49)];
      setActivity(newActivity);
      logActivity({ company: company.name, doc: dt.shortLabel, status: value });
    }
  }

  async function handleBulkDownload() {
    abortControllerRef.current = new AbortController();
    setIsDownloading(true);
    setDownloadProgress({ pct: 0, text: 'Preparing to download...', detail: 'Scanning documents...', timeRemaining: 'Estimating time...', startTime: Date.now() });
    
    try {
      const zip = new JSZip();
      const folder = zip.folder(`${sanitizeName(company.name)}_Documents`);
      let count = 0;
      let total = 0;
      const errors = [];

      // Find all valid links across all document types
      const linksToDownload = [];
      DOCUMENT_TYPES.forEach(dt => {
        const key = `${company.id}_${dt.id}`;
        const docState = docs[key];
        if (docState) {
          const links = getDocLinks(docState);
          links.forEach((link, idx) => {
            if (link && link.trim() !== '') {
              linksToDownload.push({ dt, link: link.trim(), idx });
            }
          });
        }
      });

      total = linksToDownload.length;

      if (total === 0) {
        alert("No document links found to download.");
        setIsDownloading(false);
        setDownloadProgress(null);
        return;
      }

      let completedCount = 0;

      const failedLinks = [];

      // Fetch all files concurrently to drastically speed up downloading
      const promises = linksToDownload.map(async ({ dt, link, idx }) => {
        try {
          const proxyUrls = [
            link, // Try direct first (will work if user has a CORS Unblock extension enabled)
            `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(link)}`,
            `https://api.allorigins.win/raw?url=${encodeURIComponent(link)}`,
            `https://corsproxy.io/?${encodeURIComponent(link)}`
          ];
          
          let finalBlob = null;
          let lastErr = null;
          
          for (const proxyUrl of proxyUrls) {
            let timeoutId;
            const localController = new AbortController();
            const onGlobalAbort = () => localController.abort();
            
            try {
              if (abortControllerRef.current.signal.aborted) return;
              
              // 15 second strict timeout so a single bad webpage link doesn't freeze the whole zip process
              timeoutId = setTimeout(() => localController.abort(), 15000);
              abortControllerRef.current.signal.addEventListener('abort', onGlobalAbort);
              
              const res = await fetch(proxyUrl, { signal: localController.signal });
              clearTimeout(timeoutId);
              abortControllerRef.current.signal.removeEventListener('abort', onGlobalAbort);
              
              if (res.ok) {
                const b = await res.blob();
                // Validate the blob: If it's less than 5KB or is explicitly HTML, it's a WAF block page or a standard webpage, not a real PDF.
                if (b.size < 5120 || b.type.includes('html')) {
                  lastErr = new Error(`Returned HTML instead of PDF (${b.type || 'unknown type'}, Size: ${b.size} bytes)`);
                  continue; // Try the next proxy in the chain
                }
                finalBlob = b;
                break;
              } else {
                lastErr = new Error(`HTTP ${res.status}`);
              }
            } catch (e) {
              clearTimeout(timeoutId);
              abortControllerRef.current.signal.removeEventListener('abort', onGlobalAbort);
              
              if (e.name === 'AbortError') {
                if (abortControllerRef.current.signal.aborted) return; // User cancelled
                lastErr = new Error("Connection timed out after 15 seconds");
              } else {
                lastErr = e;
              }
            }
          }
          
          if (!finalBlob) throw lastErr || new Error('All proxies failed or returned corrupted files');
          
          // Determine extension (default to .pdf)
          let ext = '.pdf';
          if (link.toLowerCase().includes('.zip')) ext = '.zip';
          else if (link.toLowerCase().includes('.xlsx')) ext = '.xlsx';
          
          // Append index if there are multiple links for the same document type
          const suffix = idx > 0 ? `_part${idx + 1}` : '';
          const filename = `${sanitizeName(company.name)}_${sanitizeName(dt.label)}${suffix}${ext}`;
          folder.file(filename, finalBlob);
          count++;
        } catch (err) {
          console.error("Failed to fetch", link, err);
          errors.push(`Failed to download ${dt.label}: ${link} (${err.message})`);
          failedLinks.push(link);
        } finally {
          completedCount++;
          const pct = Math.round((completedCount / total) * 100);
          setDownloadProgress(prev => {
            let timeRemaining = 'Estimating time...';
            if (prev && prev.startTime && pct > 0 && pct < 100) {
              const elapsed = Date.now() - prev.startTime;
              const estimatedTotal = elapsed / (pct / 100);
              const remaining = estimatedTotal - elapsed;
              timeRemaining = remaining > 60000 
                ? `~${Math.ceil(remaining/60000)}m remaining` 
                : `~${Math.ceil(remaining/1000)}s remaining`;
            } else if (pct === 100) {
              timeRemaining = 'Almost done...';
            }
            return {
              pct, 
              text: `Fetched ${completedCount} of ${total} files`, 
              detail: `Finished: ${dt.label}`,
              timeRemaining,
              startTime: prev ? prev.startTime : Date.now()
            };
          });
        }
      });

      await Promise.all(promises);

      if (abortControllerRef.current && abortControllerRef.current.signal.aborted) {
        setIsDownloading(false);
        setDownloadProgress(null);
        return;
      }

      if (errors.length > 0) {
        folder.file("_Errors.txt", "Some files could not be downloaded due to security restrictions (CORS) or dead links:\n\n" + errors.join('\n'));
      }

      setDownloadProgress(prev => ({ pct: 100, text: 'Zipping files...', detail: 'Compressing downloaded documents into a ZIP archive.', timeRemaining: 'Just a moment...', startTime: prev ? prev.startTime : Date.now() }));
      const content = await zip.generateAsync({ type: 'blob' });
      
      // If user cancelled during the zipping phase, exit immediately without downloading
      if (abortControllerRef.current && abortControllerRef.current.signal.aborted) {
        return;
      }

      // Trigger download
      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${sanitizeName(company.name)}_Documents.zip`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      setDownloadProgress(null);
      
      // FALLBACK: Auto-open any files that were blocked by WAFs so the user doesn't miss them!
      if (failedLinks.length > 0) {
        setTimeout(() => {
          alert(`Some files (${failedLinks.length}) were strictly protected by enterprise firewalls and couldn't be zipped.\n\nThey are now being opened in new tabs so you can download them natively!`);
          failedLinks.forEach(link => {
            const a = document.createElement('a');
            a.href = link;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

// ─── VIEW 4: Export ──────────────────────────────────────────────────────────
function ExportView({ companies, setCompanies, docs, setDocs, activity, setActivity, isEditMode }) {
  const [report, setReport] = useState('');

  async function exportCSV() {
    const headers = [
      'Sr. No.', 'Company', 'Sector',
      'Code of Conduct report', 'Link', 'Notes',
      'Ethics & Compliance Policy report', 'Link', 'Notes',
      'Responsible AI /AI Ethics - Guidelines', 'Link', 'Notes',
      'SDG/ESG Report', 'Link', 'Notes',
      'Annual Report', 'Link', 'Notes',
      'Earning Calls Transcript', 'Link', 'Notes',
      'Proxy Statement (US Companies) / Corporate governance report to Investors', 'Link', 'Notes',
      'Supplier Code of Conduct(If available)', 'Link', 'Notes'
    ];
    
    const workbook = new ExcelJS.Workbook();
    const sheet = workbook.addWorksheet('Tracker');
    
    // Add header row
    const headerRow = sheet.addRow(headers);
    headerRow.eachCell((cell) => {
      cell.font = { bold: true };
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF3F4F6' } };
    });

    // Add data rows
    companies.forEach(c => {
      const row = [c.id, c.name, c.sector];
      DOCUMENT_TYPES.forEach(dt => {
        const d = docs[`${c.id}_${dt.id}`] || {};
        const val = d.status === 'found' ? 'Yes' : d.status === 'not_found' ? 'No' : d.status === 'na' ? 'N/A' : '';
        const rawLinks = Array.isArray(d.link) ? d.link.filter(Boolean) : (d.link ? [d.link] : []);
        const cleanedLinks = rawLinks.map(u => cleanPastedUrl(u));
        const linkVal = cleanedLinks.join('\n');
        row.push(val, linkVal, d.notes || '');
      });
      
      const addedRow = sheet.addRow(row);
      addedRow.getCell(1).font = { bold: true }; // First column bold
      
      // Format cells for readability (top align, wrap text, and format links)
      addedRow.eachCell((cell, colNumber) => {
        const i = colNumber - 1; // 0-indexed
        
        // Align all cells to top so they don't look awkwardly middle-aligned in tall rows
        cell.alignment = { vertical: 'top', wrapText: true };
        
        // If this is a Link column (indexes 4, 7, 10...) and has content
        if ((i - 4) % 3 === 0 && cell.value) {
          const textVal = String(cell.value);
          const urls = textVal.split('\n');
          // Make it a real clickable hyperlink in Excel
          if (urls.length > 0 && urls[0].startsWith('http')) {
            cell.value = { text: textVal, hyperlink: urls[0] };
            cell.font = { color: { argb: 'FF0563C1' }, underline: true };
          }
        }
      });
    });

    // Set strategic column widths for better readability
    sheet.columns.forEach((column, i) => {
      if (i === 0) column.width = 8;        // Sr. No.
      else if (i === 1) column.width = 25;  // Company
      else if (i === 2) column.width = 18;  // Sector
      else if ((i - 4) % 3 === 0) column.width = 55; // Link columns (Wide)
      else if ((i - 5) % 3 === 0) column.width = 35; // Notes columns (Medium)
      else column.width = 15; // Status columns (Yes/No/N/A)
    });

    // Generate blob and download
    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `AI_Research_Hub_Abhishek_${new Date().toISOString().split('T')[0]}.xlsx`;
    a.click();
  }

  function exportJSON() {
    const blob = new Blob([JSON.stringify({ companies, docs, activity, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `AI_Research_Backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
  }

  const [importModal, setImportModal] = useState(null);
  const [resetModal, setResetModal] = useState(null);

  function handleImportClick() {
    if (!isEditMode) {
      setImportModal('locked');
      return;
    }
    setImportModal('confirm');
  }

  function handleResetClick() {
    if (!isEditMode) {
      setResetModal('locked');
      return;
    }
    setResetModal('confirm1');
  }

  function handleResetConfirm1() {
    setResetModal('confirm2');
  }

  function doReset() {
    localStorage.removeItem(STORAGE_KEY); 
    localStorage.removeItem(ACTIVITY_KEY); 
    localStorage.removeItem('fellowship_companies'); 
    window.location.reload(); 
  }

  function processImport(e) {
    const file = e.target.files[0];
    if (!file) {
      setImportModal(null);
      return;
    }
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.docs) {
          if (data.companies) {
            setCompanies(data.companies);
            localStorage.setItem('fellowship_companies', JSON.stringify(data.companies));
          }
          setDocs(data.docs);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data.docs));
          
          if (data.activity) {
            setActivity(data.activity);
            localStorage.setItem(ACTIVITY_KEY, JSON.stringify(data.activity));
          }
          setImportModal(null);
          // Instead of alert, we can just let it finish smoothly or do a brief success modal, 
          // but browser alert for success is okay or we just reload.
          setTimeout(() => alert('Backup imported successfully! Your work has been updated.'), 100);
        } else {
          alert('Invalid backup file structure: missing docs.');
        }
      } catch (err) {
        alert('Error parsing JSON backup file.');
      }
      e.target.value = null; // Reset
    };
    reader.readAsText(file);
  }

  function generateReport() {
    const today = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    const collected = Object.values(docs).filter(d => d.status === 'found').length;
    const resolved = Object.values(docs).filter(d => d.status !== 'pending').length;
    const completed = companies.filter(c => getCompanyStatus(docs, c.id) === 'complete');
    const inProg = companies.filter(c => getCompanyStatus(docs, c.id) === 'in-progress');
    const notStarted = companies.filter(c => getCompanyStatus(docs, c.id) === 'not-started');
    const totalDocs = companies.length * 8;

    const continents = ['North America','Europe','Oceania','South America','Africa','Asia'];
    const contLines = continents.map(cont => {
      const contCompanies = companies.filter(c => c.continent === cont);
      const done = contCompanies.filter(c => getCompanyStatus(docs, c.id) === 'complete').length;
      return `  ${cont}: ${done}/${contCompanies.length} complete`;
    }).join('\n');

    const docLines = DOCUMENT_TYPES.map(dt => {
      const found = companies.filter(c => (docs[`${c.id}_${dt.id}`] || {}).status === 'found').length;
      return `  ${dt.label}: ${found}/${companies.length} collected`;
    }).join('\n');

    const report = `Weekly Progress Report — ${today}
Researcher: Abhishek Mishra
Institution: Stevens Institute of Technology
Project: Professionalism in the AI Era

────────────────────────────────────────────────
OVERALL PROGRESS
────────────────────────────────────────────────
Companies fully documented: ${completed.length}/${companies.length}
Documents collected: ${collected}/${totalDocs} (${totalDocs > 0 ? Math.round(collected/totalDocs*100) : 0}%)
Total resolved (found + not found + N/A): ${resolved}/${totalDocs}

────────────────────────────────────────────────
PROGRESS BY REGION
────────────────────────────────────────────────
${contLines}

────────────────────────────────────────────────
PROGRESS BY DOCUMENT TYPE
────────────────────────────────────────────────
${docLines}

────────────────────────────────────────────────
COMPLETED THIS WEEK
────────────────────────────────────────────────
${completed.length > 0 ? completed.map(c => `  • ${c.name} (${c.country})`).join('\n') : '  None yet'}

IN PROGRESS
────────────────────────────────────────────────
${inProg.slice(0,15).map(c => `  • ${c.name} (${getCompanyProgress(docs, c.id)}/8 docs)`).join('\n')}${inProg.length > 15 ? `\n  ... and ${inProg.length - 15} more` : ''}

NOT STARTED (${notStarted.length} companies)
────────────────────────────────────────────────
${notStarted.slice(0,10).map(c => `  • ${c.name}`).join('\n')}${notStarted.length > 10 ? `\n  ... and ${notStarted.length - 10} more` : ''}`;
    setReport(report);
  }

  return h('div', {},
    h('div', { className: 'two-col' },
      h('div', {},
        h('div', { className: 'export-card' },
          h('h3', { style: { display: 'flex', alignItems: 'center', gap: '6px' } }, [
            h(FileTextIcon),
            'Export to Excel Tracker'
          ]),
          h('p', {}, 'Downloads a native Excel file (.xlsx) matching the exact column structure of the provided tracker template, formatted with bold headers.'),
          h('button', { className: 'btn-primary', style: { display: 'inline-flex', alignItems: 'center', gap: '6px' }, onClick: exportCSV }, [
            h(ExportIcon),
            'Download Excel'
          ]),
        ),
        h('div', { className: 'export-card' },
          h('h3', { style: { display: 'flex', alignItems: 'center', gap: '6px' } }, [
            h(GlobeIcon),
            'Backup & Restore'
          ]),
          h('p', {}, 'Export your full progress as JSON to transfer between computers, or import a previous backup.'),
          h('div', { style: { display: 'flex', gap: 10 } },
            h('button', { className: 'btn-primary', onClick: exportJSON }, 'Export Backup'),
            h('button', { className: 'btn-secondary', onClick: handleImportClick }, 'Import Backup'),
            h('input', { type: 'file', accept: '.json', style: { display: 'none' }, id: 'hidden-import', onChange: processImport })
          ),
        ),
